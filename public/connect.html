<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Connection Bot – SecretLy</title><link rel="icon" href="logo.jpg"><link rel="stylesheet" href="app.css"></head><body>
<main><h2>Connection Bot</h2><p class="sub">Hubungkan nomor WhatsApp kamu ke SecretLy.</p>
<div class="card"><label for="ph">Nomor WhatsApp (awali kode negara)</label><input id="ph" inputmode="numeric" placeholder="628123456789">
<div class="row"><button class="btn blue" id="go">Minta kode pairing</button></div><div id="out"></div><div class="msg" id="msg" role="alert"></div></div>
<div class="card"><b>Cara memasukkan kode</b><ol><li>Buka WhatsApp › Perangkat tertaut.</li><li>Pilih Tautkan perangkat › Tautkan dengan nomor telepon.</li><li>Masukkan kode 8 karakter di atas.</li></ol></div></main>
<script src="app.js"></script><script>
needLogin();shell();let tm
const show=s=>{$('#out').innerHTML=s.code?`<div class="code">${s.code.replace(/(.{4})(.+)/,'$1-$2')}</div>`:'';if(s.status==='open'){clearInterval(tm);$('#msg').className='msg o';$('#msg').textContent='Terhubung ke +'+s.phone+'. Kirim .menu ke nomor itu!'}}
$('#go').onclick=async()=>{const b=$('#go');b.disabled=true;$('#msg').textContent='';try{const s=await api('/bot/pair',{phone:$('#ph').value});show(s);clearInterval(tm);tm=setInterval(async()=>show(await api('/bot/status')),4000)}catch(e){$('#msg').className='msg e';$('#msg').textContent=e.message}b.disabled=false}
api('/bot/status').then(s=>{if(s.status==='open')show(s)}).catch(()=>{})</script></body></html>
