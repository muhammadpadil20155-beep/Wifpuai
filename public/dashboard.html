<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Dashboard – SecretLy</title><link rel="icon" href="logo.jpg"><link rel="stylesheet" href="app.css"></head><body>
<main><h2 id="hi">Dashboard</h2><p class="sub">Status bot milikmu.</p>
<div class="card"><small style="color:var(--mute);font-weight:600">Status bot</small><div style="margin:8px 0"><span class="pill" id="st">Memuat…</span></div><div id="ph" style="color:var(--mute)"></div>
<div class="row"><a class="btn blue" href="connect.html">Connection Bot</a><button class="btn line" id="on">Nyalakan</button><button class="btn red" id="off">Matikan</button></div><div class="msg" id="msg"></div></div>
<div class="card"><b>Cara pakai</b><ol><li>Buka Connection Bot, masukkan nomor WhatsApp.</li><li>Masukkan kode pairing di WhatsApp › Perangkat tertaut.</li><li>Kirim <b>.menu</b> ke nomor itu.</li></ol></div></main>
<script src="app.js"></script><script>
needLogin();shell();const L={open:'Online',connecting:'Menghubungkan',close:'Terputus',stopped:'Dimatikan',none:'Belum terhubung'}
async function st(){try{const me=await api('/me');$('#hi').textContent='Halo, '+me.name;const s=await api('/bot/status');$('#st').textContent=L[s.status]||s.status;$('#st').className='pill '+s.status;$('#ph').textContent=s.phone?'Nomor: +'+s.phone:''}catch(e){$('#st').textContent=e.message}}
for(const [id,p] of [['on','/bot/start'],['off','/bot/stop']])$('#'+id).onclick=async()=>{try{await api(p,{});$('#msg').className='msg o';$('#msg').textContent='Perintah terkirim.';setTimeout(st,1500)}catch(e){$('#msg').className='msg e';$('#msg').textContent=e.message}}
st();setInterval(st,8000)</script></body></html>
